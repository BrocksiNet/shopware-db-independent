name: Publish presentations

on:
  push:
    branches: [main]
    paths:
      - presentations/index.html
      - presentations/architecture.html
      - presentations/core-findings.html
      - .github/workflows/presentations-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare presentation files
        run: |
          mkdir -p "$RUNNER_TEMP/presentations-site"
          cp presentations/index.html presentations/architecture.html presentations/core-findings.html "$RUNNER_TEMP/presentations-site/"
      - name: Upload presentation site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/presentations-site
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v5
